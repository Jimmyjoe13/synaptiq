[alembic]
script_location = migrations
# [ATTENTION] VOLONTAIREMENT VIDE. La cible d'une migration ne se code pas en dur.
# Cette ligne valait `postgresql://...@127.0.0.1:5435/synaptiq_db`, c'est-a-dire la base
# de PRODUCTION : un `alembic upgrade head` nu depuis ce depot de developpement migrait
# donc la prod, sans le dire. `migrations/env.py` lit maintenant `DATABASE_URL` (variable
# d'environnement, sinon `.env` racine) et REFUSE de tourner si elle est absente.
# Un alembic qui ne demarre pas vaut mieux qu'un alembic qui migre la mauvaise base.
# (Commentaires ASCII uniquement : Windows lit ce fichier en cp1252, un caractere
# hors repertoire ferait echouer alembic avant meme de lire la migration.)
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
