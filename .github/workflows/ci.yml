name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-unit:
    name: Lint + tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt
      # La sélection de règles vit dans ruff.toml (E,W,F,I,B,UP,S,C4,RUF) depuis le 29/07 :
      # plus de `--select` en ligne de commande, sinon la config du dépôt est contournée.
      - name: Ruff (lint + sécurité + imports)
        run: ruff check apps packages scripts tests benchmarks migrations examples
      - name: Mypy (packages/core)
        run: mypy
      - name: Tests unitaires (sans infra) + couverture de packages/core
        # Seuil à 90 % alors que la couverture réelle est de 95 % : un garde-fou contre une
        # régression franche, pas un plafond qui casse au premier ajout de code.
        run: pytest tests/unit -q --cov=synaptiq_core --cov-report=term-missing --cov-fail-under=90
        env:
          PYTHONPATH: packages/core

  integration:
    name: Tests d'intégration (hérités)
    runs-on: ubuntu-latest
    # Garde-fou volontaire : job non bloquant tant que Jimmy n'a pas donné le
    # feu vert pour le rendre bloquant. Ne PAS retirer sans validation explicite.
    continue-on-error: true
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: synaptiq
          POSTGRES_PASSWORD: synaptiq_password
          POSTGRES_DB: synaptiq_db
        ports: ["5435:5432"]
        options: >-
          --health-cmd "pg_isready -U synaptiq -d synaptiq_db"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6399:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://synaptiq:synaptiq_password@localhost:5435/synaptiq_db
      REDIS_URL: redis://localhost:6399/0
      EMBEDDING_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt
      # Alembic est la seule autorité du schéma depuis le 29/07 : plus de psql init.sql
      # en amont (il ne crée plus que l'extension, que la révision 0001 crée aussi).
      - name: Créer le schéma (Alembic)
        run: alembic upgrade head
      - name: Tests d'intégration
        run: pytest -m integration -q
