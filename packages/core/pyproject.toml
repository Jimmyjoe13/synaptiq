[project]
name = "synaptiq-core"
# Version UNIQUE pour tout le dépôt (API, cœur, SDK) : ces composants évoluent ensemble et
# se livrent ensemble. Deux numéros distincts laisseraient croire à une compatibilité
# croisée que rien ne teste.
version = "0.3.0"
description = "Logique partagée de SynaptiQ : embeddings pluggables et gouvernance mémoire."
requires-python = ">=3.11"
# numpy : produits scalaires vectorisés du filtre de redondance Q-EM (cf. qem.py).
dependencies = ["requests>=2.31", "numpy>=1.26"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["synaptiq_core"]
