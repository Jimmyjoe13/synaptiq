# SynaptiQ — vérification de types.
#
# Périmètre volontairement limité à `packages/core` (audit F18). C'est là que vit la logique
# partagée : cœur Q-EM, orchestration, gouvernance, embeddings. C'est aussi le code qu'une
# implémentation tierce consommerait, donc celui dont les signatures doivent être justes —
# mypy y a d'ailleurs immédiatement trouvé deux annotations FAUSSES (`route_memory`
# annoncait `-> str` en renvoyant None, `compute_recency_factor` refusait le None qu'il
# traite pourtant).
#
# `apps/` reste hors périmètre pour l'instant : psycopg2 et les curseurs non typés y
# produiraient beaucoup de bruit pour peu de valeur. À étendre progressivement.

[mypy]
python_version = 3.11
files = packages/core/synaptiq_core
ignore_missing_imports = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
# Pas de `strict` : le code manipule des dict[str, Any] venant de la base, un typage
# intégral demanderait des TypedDict partout. L'objectif ici est d'attraper les signatures
# fausses et les oublis d'annotation, pas la preuve formelle.
check_untyped_defs = True
no_implicit_optional = True
