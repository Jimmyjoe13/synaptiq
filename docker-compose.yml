# SynaptiQ — stack complète (Postgres + Redis + API + Worker + MCP)
# Prérequis : LM Studio lancé sur l'hôte (serveur local, modèle d'embedding chargé, port 1234).
# Démarrage : cp .env.example .env && docker compose up

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: synaptiq-postgres
    ports:
      - "127.0.0.1:5435:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-synaptiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synaptiq_password}
      POSTGRES_DB: ${POSTGRES_DB:-synaptiq_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synaptiq -d synaptiq_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - synaptiq-network

  redis:
    image: redis:7-alpine
    container_name: synaptiq-redis
    ports:
      - "127.0.0.1:6399:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - synaptiq-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: synaptiq-api
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      # Surcharge des URLs pour le réseau interne Docker
      DATABASE_URL: postgresql://${POSTGRES_USER:-synaptiq}:${POSTGRES_PASSWORD:-synaptiq_password}@postgres:5432/${POSTGRES_DB:-synaptiq_db}
      REDIS_URL: redis://redis:6379/0
      # LM Studio tourne sur l'hôte, joignable depuis un conteneur via
      # host.docker.internal. La surcharge passe par une variable DISTINCTE
      # (`*_DOCKER`), et c'est tout l'intérêt — voir la note du worker.
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL_DOCKER:-http://host.docker.internal:1234/v1}
      # L'API aussi appelle un LLM : `POST /v1/memories` soumet les préférences proches au
      # juge de contradiction (`synaptiq_core.contradiction`), qui lit `LLM_BASE_URL`. Sans
      # cette surcharge, l'API interrogerait son propre conteneur ; le juge étant
      # fail-closed, plus rien ne serait jamais archivé — en silence, encore.
      LLM_BASE_URL: ${LLM_BASE_URL_DOCKER:-http://host.docker.internal:1234/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health | grep -q '\"status\":\"ok\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - synaptiq-network

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: synaptiq-worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-synaptiq}:${POSTGRES_PASSWORD:-synaptiq_password}@postgres:5432/${POSTGRES_DB:-synaptiq_db}
      REDIS_URL: redis://redis:6379/0
      # LM Studio (embeddings ET extraction LLM) tourne sur l'hôte : sans ces deux
      # surcharges, 'localhost' désignerait le conteneur worker lui-même.
      #
      # ⚠️ La surcharge doit passer par une variable au nom DIFFÉRENT de celle qu'elle
      # surcharge. Le commit a0b844b a rendu `EMBEDDING_BASE_URL` configurable en réutilisant
      # le MÊME nom — `${EMBEDDING_BASE_URL:-http://host.docker.internal:1234/v1}`. Or le
      # `.env` déclare légitimement `EMBEDDING_BASE_URL=http://localhost:1234/v1`, valeur
      # juste pour un process de l'hôte : la substitution la reprenait donc, et le conteneur
      # se pointait sur lui-même. Résultat mesuré le 30/07 : `Connection refused` sur
      # /v1/embeddings à chaque événement, 5 tentatives, puis DLQ. Le chemin `/events` était
      # entièrement hors service en conteneur, sans que la configuration paraisse fausse.
      #
      # `LLM_BASE_URL` échappait déjà au piège grâce à `LLM_BASE_URL_DOCKER` ; les deux
      # variables suivent maintenant la même règle. Laisser les deux valeurs par défaut
      # convient à LM Studio sur l'hôte ; les renseigner permet de viser un fournisseur
      # distant (par ex. `EMBEDDING_BASE_URL_DOCKER=https://openrouter.ai/api/v1`) sans
      # toucher à la valeur utilisée hors conteneur.
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL_DOCKER:-http://host.docker.internal:1234/v1}
      LLM_BASE_URL: ${LLM_BASE_URL_DOCKER:-http://host.docker.internal:1234/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - synaptiq-network

  relay:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: synaptiq-relay
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-synaptiq}:${POSTGRES_PASSWORD:-synaptiq_password}@postgres:5432/${POSTGRES_DB:-synaptiq_db}
      REDIS_URL: redis://redis:6379/0
    command: ["python", "-u", "apps/relay/relay.py"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - synaptiq-network

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: synaptiq-migrate
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-synaptiq}:${POSTGRES_PASSWORD:-synaptiq_password}@postgres:5432/${POSTGRES_DB:-synaptiq_db}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - synaptiq-network

  mcp:
    build:
      context: .
      dockerfile: apps/mcp/Dockerfile
    container_name: synaptiq-mcp
    profiles: ["mcp-http"]
    ports:
      - "127.0.0.1:8765:8765"
    env_file: .env
    environment:
      SYNAPTIQ_API_URL: http://api:8000
      MCP_TRANSPORT: sse
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8765
      SYNAPTIQ_AUTH_REQUIRED: "true"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - synaptiq-network

volumes:
  postgres_data:
  redis_data:

networks:
  synaptiq-network:
    driver: bridge
